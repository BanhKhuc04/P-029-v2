<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>PointSnap 3D — Luồng hoạt động</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; background: #F4F6F9; }
  svg { display: block; font-family: 'IBM Plex Sans', 'Segoe UI', sans-serif; }
  .t-title { font-size: 34px; font-weight: 700; fill: #0F2A47; }
  .t-sub { font-size: 17px; fill: #4A5563; }
  .card { fill: #FFFFFF; stroke: #DDE2E8; stroke-width: 1.5; }
  .card-hl { fill: #FFFFFF; stroke: #0B63CE; stroke-width: 2.5; }
  .num { fill: #0F2A47; }
  .num-hl { fill: #0B63CE; }
  .num-t { font-size: 16px; font-weight: 700; fill: #FFFFFF; }
  .h { font-size: 19px; font-weight: 700; fill: #161B22; }
  .who { font-size: 13px; font-weight: 600; fill: #0B63CE; letter-spacing: .04em; }
  .b { font-size: 15px; fill: #4A5563; }
  .mono { font-family: 'IBM Plex Mono', Consolas, monospace; font-size: 13px; fill: #0A57B5; }
  .chip { fill: #E8F1FC; stroke: #B8D3F5; }
  .chip-t { font-size: 14px; font-weight: 600; fill: #0A57B5; }
  .arrow { stroke: #68717D; stroke-width: 2.5; fill: none; }
  .arrow-loop { stroke: #B42318; stroke-width: 2.5; fill: none; stroke-dasharray: 7 6; }
  .arrow-eval { stroke: #68717D; stroke-width: 2; fill: none; stroke-dasharray: 5 6; }
  .pass { fill: #EBF8F1; stroke: #157A4A; }
  .fail { fill: #FDEEEE; stroke: #B42318; }
  .pass-t { font-size: 15px; font-weight: 700; fill: #157A4A; }
  .fail-t { font-size: 15px; font-weight: 700; fill: #B42318; }
  .band { fill: #FFFFFF; stroke: #DDE2E8; stroke-width: 1.5; }
  .note { font-size: 14px; fill: #68717D; }
</style>
</head>
<body>
<svg width="1600" height="1000" viewBox="0 0 1600 1000" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#68717D"/>
    </marker>
    <marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#B42318"/>
    </marker>
  </defs>

  <!-- Tiêu đề -->
  <g transform="translate(40 34)">
    <g transform="scale(1.1)">
      <path d="M24 6 L38 14 L24 22 L10 14 Z M10 14 V30 L24 38 L38 30 V14 M24 22 V38" stroke="#0F2A47" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
      <path d="M3 38 H16 M32 38 H45" stroke="#0F2A47" stroke-width="3" stroke-linecap="round" opacity="0.4"/>
      <circle cx="24" cy="38" r="4.5" fill="#0B63CE"/>
    </g>
  </g>
  <text x="104" y="70" class="t-title">PointSnap 3D — luồng hoạt động</text>
  <text x="104" y="100" class="t-sub">Phát hiện sớm 3 loại lỗi nhãn 3D cuboid trên CVAT trước khi nộp · Nguyên tắc: tool đề xuất, con người quyết định</text>

  <!-- 6 bước -->
  <!-- Bước 1 -->
  <rect x="40" y="150" width="230" height="350" rx="10" class="card"/>
  <circle cx="72" cy="182" r="16" class="num"/><text x="72" y="188" text-anchor="middle" class="num-t">1</text>
  <text x="100" y="178" class="who">DỮ LIỆU</text>
  <text x="100" y="198" class="h">nuScenes mini</text>
  <text x="60" y="240" class="b">10 cảnh lái xe thật</text>
  <text x="60" y="264" class="b">Point cloud LiDAR</text>
  <text x="60" y="288" class="b">+ ảnh 6 camera</text>
  <text x="60" y="312" class="b">+ nhãn chuẩn có ID track</text>
  <text x="60" y="352" class="mono">nuscenes to-cvat</text>
  <text x="60" y="374" class="b">tạo task 3D trên CVAT</text>
  <text x="60" y="398" class="b">và nạp nhãn</text>

  <!-- Bước 2 -->
  <rect x="300" y="150" width="230" height="350" rx="10" class="card"/>
  <circle cx="332" cy="182" r="16" class="num"/><text x="332" y="188" text-anchor="middle" class="num-t">2</text>
  <text x="360" y="178" class="who">ANNOTATOR</text>
  <text x="360" y="198" class="h">Gán nhãn 3D</text>
  <text x="320" y="240" class="b">Vẽ box trên CVAT cho xe,</text>
  <text x="320" y="264" class="b">người, xe đạp… qua</text>
  <text x="320" y="288" class="b">từng frame (track)</text>
  <text x="320" y="330" class="note">Khi demo: nhãn chuẩn</text>
  <text x="320" y="352" class="note">nuScenes đóng vai</text>
  <text x="320" y="374" class="note">"bài đã gán xong"</text>

  <!-- Bước 3 (lõi) -->
  <rect x="560" y="150" width="250" height="350" rx="10" class="card-hl"/>
  <circle cx="592" cy="182" r="16" class="num-hl"/><text x="592" y="188" text-anchor="middle" class="num-t">3</text>
  <text x="620" y="178" class="who">POINTSNAP 3D</text>
  <text x="620" y="198" class="h">Quét job</text>
  <text x="580" y="236" class="b">Đọc nhãn qua API CVAT</text>
  <text x="580" y="258" class="b">+ point cloud từng frame</text>
  <text x="580" y="280" class="b">→ ước lượng mặt đất</text>
  <rect x="580" y="300" width="210" height="40" rx="6" class="chip"/>
  <text x="685" y="326" text-anchor="middle" class="chip-t">Lơ lửng / lún đất</text>
  <rect x="580" y="350" width="210" height="40" rx="6" class="chip"/>
  <text x="685" y="376" text-anchor="middle" class="chip-t">Sai kích thước</text>
  <rect x="580" y="400" width="210" height="40" rx="6" class="chip"/>
  <text x="685" y="426" text-anchor="middle" class="chip-t">Đứt track</text>
  <text x="580" y="472" class="note">3 bộ phát hiện, theo guideline dự án</text>

  <!-- Bước 4 -->
  <rect x="840" y="150" width="230" height="350" rx="10" class="card"/>
  <circle cx="872" cy="182" r="16" class="num"/><text x="872" y="188" text-anchor="middle" class="num-t">4</text>
  <text x="900" y="178" class="who">KẾT QUẢ</text>
  <text x="900" y="198" class="h">Báo lỗi cụ thể</text>
  <text x="860" y="240" class="b">Box nào, frame nào,</text>
  <text x="860" y="264" class="b">sai bao nhiêu (cm, m)</text>
  <text x="860" y="300" class="b">Mức: Lỗi / Cảnh báo</text>
  <text x="860" y="336" class="b">Giao diện web, HTML,</text>
  <text x="860" y="360" class="b">CSV; xem nhanh 3D</text>
  <text x="860" y="396" class="b">Gắn cờ lên box:</text>
  <text x="860" y="418" class="mono">pointsnap_error</text>

  <!-- Bước 5 -->
  <rect x="1100" y="150" width="230" height="350" rx="10" class="card"/>
  <circle cx="1132" cy="182" r="16" class="num"/><text x="1132" y="188" text-anchor="middle" class="num-t">5</text>
  <text x="1160" y="178" class="who">ANNOTATOR</text>
  <text x="1160" y="198" class="h">Sửa trên CVAT</text>
  <text x="1120" y="240" class="b">Lọc chỉ hiện box</text>
  <text x="1120" y="264" class="b">có cờ lỗi</text>
  <text x="1120" y="300" class="b">Sửa theo chỉ dẫn:</text>
  <text x="1120" y="324" class="b">hạ đáy box, chỉnh</text>
  <text x="1120" y="348" class="b">kích thước, nối track</text>
  <text x="1120" y="390" class="note">Con người quyết định;</text>
  <text x="1120" y="412" class="note">tool không tự đổi box</text>

  <!-- Bước 6 -->
  <rect x="1360" y="150" width="200" height="350" rx="10" class="card"/>
  <circle cx="1392" cy="182" r="16" class="num"/><text x="1392" y="188" text-anchor="middle" class="num-t">6</text>
  <text x="1420" y="178" class="who">CỔNG</text>
  <text x="1420" y="198" class="h">Kiểm soát</text>
  <text x="1380" y="240" class="b">Quét lại rồi so</text>
  <text x="1380" y="264" class="b">với tiêu chí đạt</text>
  <rect x="1380" y="292" width="160" height="60" rx="8" class="pass" stroke-width="1.5"/>
  <text x="1460" y="318" text-anchor="middle" class="pass-t">ĐẠT</text>
  <text x="1460" y="340" text-anchor="middle" class="b">→ Nộp</text>
  <rect x="1380" y="370" width="160" height="60" rx="8" class="fail" stroke-width="1.5"/>
  <text x="1460" y="396" text-anchor="middle" class="fail-t">KHÔNG ĐẠT</text>
  <text x="1460" y="418" text-anchor="middle" class="b">→ sửa tiếp</text>

  <!-- Mũi tên giữa các bước -->
  <path d="M272 325 H298" class="arrow" marker-end="url(#ah)"/>
  <path d="M532 325 H558" class="arrow" marker-end="url(#ah)"/>
  <path d="M812 325 H838" class="arrow" marker-end="url(#ah)"/>
  <path d="M1072 325 H1098" class="arrow" marker-end="url(#ah)"/>
  <path d="M1332 325 H1358" class="arrow" marker-end="url(#ah)"/>

  <!-- Vòng lặp: không đạt → quét lại -->
  <path d="M1460 432 V560 H685 V502" class="arrow-loop" marker-end="url(#ah-red)"/>
  <rect x="930" y="545" width="310" height="30" rx="6" fill="#F4F6F9"/>
  <text x="1085" y="566" text-anchor="middle" class="fail-t">Không đạt: sửa xong thì quét lại</text>

  <!-- Đánh giá -->
  <rect x="40" y="620" width="1520" height="200" rx="10" class="band"/>
  <text x="64" y="656" class="who">ĐÁNH GIÁ ĐỘ CHÍNH XÁC CỦA TOOL</text>
  <text x="64" y="684" class="h">Chèn lỗi giả vào nhãn chuẩn → xem tool bắt được bao nhiêu</text>

  <rect x="64" y="706" width="430" height="92" rx="8" fill="#F7F9FB" stroke="#DDE2E8"/>
  <text x="84" y="734" class="b" font-weight="600" fill="#161B22">Lỗi chèn có kiểm soát</text>
  <text x="84" y="758" class="b">Nâng / hạ đáy 5–40 cm · kích thước ×0,6 / ×1,5</text>
  <text x="84" y="780" class="b">Nhảy vị trí 0,5–4 m · tách ID · xóa keyframe</text>

  <path d="M496 752 H540" class="arrow" marker-end="url(#ah)"/>
  <rect x="544" y="706" width="430" height="92" rx="8" fill="#F7F9FB" stroke="#DDE2E8"/>
  <text x="564" y="734" class="b" font-weight="600" fill="#161B22">Chạy cùng 3 bộ phát hiện (bước 3)</text>
  <text x="564" y="758" class="b">5 cảnh tinh chỉnh: chọn ngưỡng</text>
  <text x="564" y="780" class="b">5 cảnh kiểm tra: chỉ để báo cáo</text>

  <path d="M976 752 H1020" class="arrow" marker-end="url(#ah)"/>
  <rect x="1024" y="706" width="512" height="92" rx="8" fill="#F7F9FB" stroke="#DDE2E8"/>
  <text x="1044" y="734" class="b" font-weight="600" fill="#161B22">Chỉ số</text>
  <text x="1044" y="758" class="b">Recall, precision theo từng loại lỗi và mức độ</text>
  <text x="1044" y="780" class="b">Báo nhầm trên nhãn sạch (≤ 2 Cảnh báo / 100 box)</text>

  <path d="M155 502 V618" class="arrow-eval" marker-end="url(#ah)"/>
  <text x="166" y="566" class="note">dùng nhãn chuẩn làm đáp án</text>

  <!-- Chân trang -->
  <text x="40" y="870" class="note">Vấn đề: thời gian gán nhãn 3D bị lãng phí chủ yếu ở vòng "nộp → bị trả về → sửa → nộp lại" (rework ~25–35% thời lượng, quan sát nội bộ).</text>
  <text x="40" y="896" class="note">Mục tiêu: chỉ ra chính xác box nào sai, ở frame nào, sai bao nhiêu, ngay trong CVAT, để sửa trước khi nộp.</text>
  <text x="40" y="940" class="note">Công nghệ: Python + CVAT REST API · giao diện web FastAPI · dữ liệu nuScenes v1.0-mini · CVAT 2.77 chạy Docker.</text>
</svg>
</body>
</html>
