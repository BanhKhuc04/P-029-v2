name: test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  pytest:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.10"
          - os: ubuntu-latest
            python: "3.11"
          - os: windows-latest
            python: "3.12"
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: source-tool/pointsnap-3d
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: source-tool/pointsnap-3d/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: python -m pytest -q tests auto-tests --junitxml=pytest-results.xml

  artifact:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: source-tool/pointsnap-3d
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install build
      - run: python -m build
      - name: Install wheel in separate environment and smoke outside source
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/pointsnap-artifact"
          "$RUNNER_TEMP/pointsnap-artifact/bin/python" -m pip install dist/*.whl
          "$RUNNER_TEMP/pointsnap-artifact/bin/python" -m pip check
          smoke="$PWD/scripts/smoke_package.py"
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/pointsnap-artifact/bin/python" "$smoke"

  extension:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: source-tool/pointsnap-3d/extension
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test tests/*.test.js
      - name: Kiểm tra cú pháp các file JS và manifest
        run: |
          for f in background.js options.js src/*.js; do node --check "$f"; done
          node -e "JSON.parse(require('fs').readFileSync('manifest.json', 'utf8'))"
