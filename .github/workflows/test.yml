name: test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: source-tool/pointsnap-3d
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: source-tool/pointsnap-3d/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: python -m pytest -q
