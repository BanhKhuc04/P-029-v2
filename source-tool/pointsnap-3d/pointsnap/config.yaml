# Cấu hình mặc định của PointSnap 3D.
#
# Đơn vị: mét, giây, radian. Tỉ lệ ghi dạng thập phân (0.05 = 5%).
# Ngưỡng là mặc định đề xuất ở mục 4.1 của de-xuat-de-tai.md, sẽ chốt ở việc B7.
# Muốn đổi cho riêng mình: tạo file YAML chỉ chứa phần cần đổi, chạy `pointsnap --config <file> ...`.
# Token CVAT KHÔNG ghi ở đây: đặt qua biến môi trường CVAT_TOKEN.

cvat:
  url: http://localhost:8080          # CVAT_URL ghi đè giá trị này; url trong file --config lại ưu tiên hơn CVAT_URL
  flag_attribute: pointsnap_error     # thuộc tính văn bản dùng để gắn cờ lỗi lên box

floating:                             # lơ lửng / lún đất (B3); kiểm chứng trên 10 cảnh mini: docs/kiem-chung-ground.md
  classes: [car, truck, bus, trailer, construction_vehicle, pedestrian, motorcycle, bicycle]
  warning_m: 0.12                     # |d − trung vị d của các box khác trong track| > 12 cm: Cảnh báo (B7)
  error_m: 0.22                       # > 22 cm: Lỗi, nếu |d| tuyệt đối cũng > error_min_abs_m
  error_min_abs_m: 0.15
  single_warning_m: 0.15              # box lẻ / track ít box có bằng chứng: so |d| tuyệt đối
  single_error_m: 0.30
  min_track_boxes: 2                  # cần ít nhất 2 box khác cùng track có bằng chứng mới so theo track
  ring_inner_m: 0.1                   # vành đai lấy điểm ground: từ mép footprint + 0.1 m
  ring_outer_m: 0.8                   # ... tới mép footprint + 0.8 m
  min_ground_points: 15               # ít hơn: ghi "thiếu bằng chứng" ở mức Thông tin

size:
  class_range:                        # kiểu 1: bất thường so với class
    percentile_low: 1
    percentile_high: 99
    warning_margin: 0.10              # Cảnh báo nếu ngoài [p_low − 10%, p_high + 10%] (B7: thống kê từ 5 cảnh còn hẹp)
    error_margin: 0.25                # Lỗi nếu ngoài [p_low − 25%, p_high + 25%]
    min_instances: 20                 # class ít instance hơn thì dùng manual_ranges
    # [p_low, p_high] theo class, tính trên trung vị kích thước của từng đối tượng. Sinh bằng scripts/build_size_stats.py
    # từ 5 cảnh tinh chỉnh (scene-0061, 0553, 0757, 0916, 1094); chỉ class có >= min_instances đối tượng.
    stats:
      barrier:      {length: [0.40, 0.76], width: [1.73, 3.36], height: [0.90, 1.35]}  # 75 đối tượng, 1637 box
      car:          {length: [3.90, 5.79], width: [1.58, 2.41], height: [1.39, 2.41]}  # 124 đối tượng, 2490 box
      pedestrian:   {length: [0.48, 1.10], width: [0.50, 0.98], height: [1.28, 2.00]}  # 151 đối tượng, 2824 box
      traffic_cone: {length: [0.35, 0.69], width: [0.36, 0.96], height: [0.55, 1.33]}  # 72 đối tượng, 578 box
  manual_ranges:                      # class ít mẫu (< min_instances): bus, trailer, construction_vehicle chốt ở B7
                                      # (Khánh & Huy); truck, motorcycle, bicycle thêm ở A10
    bus:                  {length: [6.0, 18.5], width: [2.2, 3.2], height: [2.4, 4.5]}
    trailer:              {length: [2.0, 18.0], width: [1.5, 3.2], height: [1.0, 4.5]}
    construction_vehicle: {length: [2.5, 12.0], width: [1.5, 3.5], height: [1.8, 5.0]}
    truck:                {length: [4.5, 12.5], width: [1.8, 3.2], height: [1.9, 4.3]}
    motorcycle:           {length: [1.5, 2.6],  width: [0.55, 1.2], height: [1.0, 2.0]}
    bicycle:              {length: [1.2, 2.1],  width: [0.4, 0.95], height: [0.8, 2.0]}
  in_track:                           # kiểu 2: kích thước dao động trong cùng một track
    min_keyframes: 3
    excluded_classes: [pedestrian]    # tư thế thay đổi nên kích thước dao động là bình thường
    warning_abs_m: 0.10               # Cảnh báo nếu lệch so với trung vị track > max(0.10 m, 5%)
    warning_rel: 0.05
    error_abs_m: 0.30                 # Lỗi nếu lệch > max(0.30 m, 15%)
    error_rel: 0.15
    suspect_id_rel: 0.30              # lệch hơn 30%: ghi chú "nghi nhầm ID"

track:
  keyframe_interval_s: 0.5
  groups:                             # ngưỡng nhảy vị trí tính theo độ lệch so với vị trí nội suy
    vehicle:
      classes: [car, truck, bus, trailer, construction_vehicle]
      jump_warning_m: 1.0
      jump_error_m: 2.0
      v_max_mps: 30.0                 # chỉ dùng ở hai đầu track
      split_max_dist_m: 2.0
    two_wheeler:
      classes: [motorcycle, bicycle]
      jump_warning_m: 0.75
      jump_error_m: 1.5
      v_max_mps: 10.0
      split_max_dist_m: 1.5
    pedestrian:
      classes: [pedestrian]
      jump_warning_m: 0.5
      jump_error_m: 1.0
      v_max_mps: 3.0
      split_max_dist_m: 1.0
    static:                           # vật đứng yên: dịch trong hệ toàn cục là sai
      classes: [traffic_cone, barrier]
      jump_warning_m: 0.3
      jump_error_m: 0.6
      v_max_mps: 0.5
      split_max_dist_m: 0.5
  split_max_gap_frames: 3             # track mới bắt đầu trong k+1..k+3 thì xét nghi tách ID
  long_interpolation:                 # việc B5b: ≥ min_frames frame liền chỉ có box nội suy
    enabled: true
    min_frames: 2
    min_motion_m: 1.0

gate:
  max_errors: 0
  max_warnings: 10
